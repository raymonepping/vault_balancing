# config/defaults.conf: tracked defaults for image pins, host ports and names.
# scripts/compose.sh loads this file first and .env second, so any value can
# be overridden in .env without editing a compose file. scripts/common.sh,
# scripts/ports-check.sh and scripts/sites.js read the same names.
# Topology (which sites exist, their role at bootstrap) is config/sites.json;
# the host port of every node is here: VBAL_PORT_SEAL_<SITE> and
# VBAL_PORT_VAULT_<SITE>_<n>.
# Dependabot cannot parse this file: bump images here by hand.

# ── Images (arm64; check Architecture after every pull) ───────────────────────
VAULT_ENT_IMAGE=docker.io/hashicorp/vault-enterprise:2.2.1-ent
HAPROXY_IMAGE=docker.io/library/haproxy:3.2-alpine
NODE_IMAGE=docker.io/library/node:24-alpine
NGINX_IMAGE=docker.io/library/nginx:1.30.0-alpine
ALPINE_IMAGE=docker.io/library/alpine:3.24.1

# ── Host ports (all published on 127.0.0.1) ───────────────────────────────────
# Next to vault_codex (19000s, 13700s) and vault_dance (18900s, 13600s): free on 2026-11-10.
VBAL_PORT_SEAL_AMS=19100
VBAL_PORT_VAULT_AMS_1=19101
VBAL_PORT_VAULT_AMS_2=19102
VBAL_PORT_VAULT_AMS_3=19103
VBAL_PORT_SEAL_FRA=19110
VBAL_PORT_VAULT_FRA_1=19111
VBAL_PORT_VAULT_FRA_2=19112
VBAL_PORT_VAULT_FRA_3=19113
VBAL_PORT_SEAL_DUB=19120
VBAL_PORT_VAULT_DUB_1=19121
VBAL_PORT_VAULT_DUB_2=19122
VBAL_PORT_VAULT_DUB_3=19123
VBAL_PORT_FRONTDOOR=19180
VBAL_PORT_STATS=19181
VBAL_PORT_WEB=19190
VBAL_PORT_API=19191

# ── Console ───────────────────────────────────────────────────────────────────
VBAL_WEB_CN=balancing.localhost

# ── Drill timing (D9, D10, D14) ───────────────────────────────────────────────
VBAL_TICK_MS=250
VBAL_DR_TOKEN_TTL=28800

# ── Application images (make app-build) ───────────────────────────────────────
VBAL_IMAGE_PREFIX=localhost/vault-balancing
VBAL_IMAGE_TAG=local

# ── Probe (prompt 03): scratch clusters, created and removed by make probe ──
VBAL_PORT_PROBE_A=19130
VBAL_PORT_PROBE_B=19131
VBAL_PORT_PROBE_C=19132

# ── Identity and the operator console (prompt 12, D15, D16) ─────────────────
OPENLDAP_IMAGE=docker.io/osixia/openldap:1.5.0
KEYCLOAK_IMAGE=docker.io/keycloak/keycloak:26.8.1
VBAL_PORT_KEYCLOAK=19192
VBAL_PORT_RUNNER=19193
