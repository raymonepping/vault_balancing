# ticker_secret: the ticker's AppRole credential (the one hand-over). The
# role-id is written when it differs; a secret-id is issued when the file is
# missing, Vault no longer knows it, or less than 12h of its 24h is left. The
# agent re-reads the file on every login (remove_secret_id_file_after_reading
# = false), so no restart is needed. Needs vbal_primary.
- name: Ensure .secrets/approle/ticker (0700, shared with the agent read-only)
  ansible.builtin.file:
    path: "{{ vbal_root }}/.secrets/approle/ticker"
    state: directory
    mode: "0700"

- name: Read the ticker's role-id
  ansible.builtin.uri:
    url: "{{ vbal_primary.nodes[0].addr }}/v1/payments/auth/approle/role/ticker/role-id"
    ca_path: "{{ vbal_ca }}"
    headers:
      X-Vault-Token: "{{ vbal_platform_token }}"
  register: ticker_role_id
  check_mode: false  # a read; check mode must see the real state
  no_log: true

- name: Write the role-id (an identifier, not a credential)
  ansible.builtin.copy:
    dest: "{{ vbal_root }}/.secrets/approle/ticker/role-id"
    content: "{{ ticker_role_id.json.data.role_id }}"
    mode: "0640"

- name: Is the current secret-id still known, and for how long?
  ansible.builtin.uri:
    url: "{{ vbal_primary.nodes[0].addr }}/v1/payments/auth/approle/role/ticker/secret-id/lookup"
    ca_path: "{{ vbal_ca }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vbal_platform_token }}"
    body_format: json
    body:
      secret_id: "{{ lookup('ansible.builtin.file', vbal_root + '/.secrets/approle/ticker/secret-id', errors='ignore') | default('none', true) }}"
    status_code: [200, 204, 400, 404]
  register: ticker_secret_lookup
  check_mode: false  # a read; check mode must see the real state
  no_log: true

- name: Remaining seconds of the current secret-id
  ansible.builtin.set_fact:
    # Both sides naive UTC: Vault's expiration_time and now(utc=true).
    ticker_secret_left: >-
      {{ ((ticker_secret_lookup.json.data.expiration_time[:19] | to_datetime('%Y-%m-%dT%H:%M:%S'))
          - now(utc=true)).total_seconds() | int }}
  when: ticker_secret_lookup.status == 200
  no_log: true

- name: Issue a secret-id when needed
  ansible.builtin.uri:
    url: "{{ vbal_primary.nodes[0].addr }}/v1/payments/auth/approle/role/ticker/secret-id"
    ca_path: "{{ vbal_ca }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vbal_platform_token }}"
    body_format: json
    body:
      metadata: '{"issued_by":"ansible"}'
  register: ticker_secret_new
  when: ticker_secret_lookup.status != 200 or (ticker_secret_left | int) < 43200
  changed_when: true
  no_log: true

- name: Write it (0640, group 1000 = the agent's group)
  ansible.builtin.copy:
    dest: "{{ vbal_root }}/.secrets/approle/ticker/secret-id"
    content: "{{ ticker_secret_new.json.data.secret_id }}"
    mode: "0640"
  when: ticker_secret_new.json is defined
  no_log: true
